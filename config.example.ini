; Copy this file to config.ini and fill in your connection details.
; config.ini is read by every command (python -m dbexplorer ...).

[connection]
server = MYSERVER\INSTANCE
database = BrokerDB
; windows = use your Windows login (Trusted_Connection); sql = SQL login below
auth = windows
username =
; Leave blank and set the DBX_PASSWORD environment variable instead, if you prefer.
password =
; auto = pick the newest installed driver (ODBC Driver 18/17, Native Client, legacy "SQL Server")
driver = auto
; Needed for ODBC Driver 18 against servers with self-signed certificates.
trust_server_certificate = yes
encrypt = no

[analysis]
; A column prefix must cover at least this fraction of a table's columns.
min_prefix_coverage = 0.6
min_prefix_length = 2
max_prefix_length = 4
; Logical column names that are never treated as join keys (after the prefix is stripped).
generic_columns = quantity, qty, amount, amt, price, rate, costs, cost, value, total, remarks,
    remark, description, desc, narration, comments, status, flag, active, isactive, deleted,
    isdeleted, createdby, createddate, createdon, createdat, modifiedby, modifieddate, modifiedon,
    updatedby, updateddate, updatedon, updatedat, insertedby, inserteddate, timestamp, rowversion,
    name, date, time, dt, type, remarks1, remarks2, seq, sno, srno, version
; A logical name present in more than this fraction of tables is treated as an audit/generic column.
max_table_fraction = 0.5
; Name-only "peer" groups (no PK/unique owner found) larger than this are listed but not drawn.
max_peer_group = 6

[prefix_overrides]
; table_name = prefix   (use when automatic detection picks the wrong prefix; use "-" for no prefix)
; trade = trd
; vaults = vl

[logical_aliases]
; Treat several logical names as the same key, e.g. client = clientcode, clientid, cliid
; client = clientcode, clientid

[profiling]
; Rows sampled per table (TABLESAMPLE for big tables, whole table when smaller).
sample_rows = 20000
; Columns with at most this many distinct values get their full value list (status, type codes...).
value_list_max = 30
; Example values kept per non-sensitive column (for test data generation). 0 = none.
example_values = 3
query_timeout = 60
; Skip tables whose name matches any of these (comma-separated, * wildcard), e.g. *_bak, tmp_*
skip_tables =

[sensitive]
; Column names (raw or logical) to always treat as sensitive / never treat as sensitive.
include =
exclude =

[export]
; Include procedure source code in the knowledge base / AI context files.
include_source = yes
; Max source lines per procedure file (very long procedures are truncated with a note).
max_source_lines = 600

[validation]
; Rows sampled from the child column when checking value overlap against a candidate parent.
sample_rows = 5000
; Per-query timeout in seconds. Queries use NOLOCK and only read.
query_timeout = 30
; Only validate edges whose confidence is between these bounds (declared FKs are skipped).
min_confidence = 20
max_confidence = 95
